[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-city-core"
version = "0.1.0"
description = "Shared city-query utilities for skills"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["playwright>=1.40"]
excel = ["openpyxl>=3.1"]

[project.scripts]
query-city-resolve-city = "query_city_core.address.city:main"
query-city-process-addresses = "query_city_core.address.process:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
query_city_core = ["assets/*.json"]
